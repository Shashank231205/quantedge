name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantedge
          POSTGRES_PASSWORD: quantedge
          POSTGRES_DB: quantedge
        ports: ["5432:5432"]
        # pg_isready defaults to the invoking OS user, which on the runner is
        # root — a role this image never creates, so the probe fails forever
        # and the job dies waiting. Name the role and database explicitly.
        options: >-
          --health-cmd "pg_isready -U quantedge -d quantedge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://quantedge:quantedge@localhost:5432/quantedge

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check quantedge tests

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      # Correctness tests gate the build. A lookahead regression must never
      # reach main — the credibility of every reported number depends on it.
      - name: Test
        working-directory: backend
        run: pytest -v -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
