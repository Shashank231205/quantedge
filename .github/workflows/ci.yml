name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantedge
          POSTGRES_PASSWORD: quantedge
          POSTGRES_DB: quantedge
        ports: ["5432:5432"]
        # pg_isready defaults to the invoking OS user, which on the runner is
        # root — a role this image never creates, so the probe fails forever
        # and the job dies waiting. Name the role and database explicitly.
        options: >-
          --health-cmd "pg_isready -U quantedge -d quantedge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://quantedge:quantedge@localhost:5432/quantedge

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check quantedge tests

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      # Correctness tests gate the build. A lookahead regression must never
      # reach main — the credibility of every reported number depends on it.
      - name: Test
        working-directory: backend
        run: pytest -v -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  # Every ops config is checked by the tool that will load it, so a typo fails
  # here rather than at 3am when a container restarts with it.
  ops-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose file
        run: docker compose --profile ha --profile monitoring config --quiet
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Alertmanager config
        run: |
          docker run --rm -v "$PWD/ops/alertmanager:/cfg:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /cfg/alertmanager.yml
      - name: HAProxy config
        run: |
          docker run --rm -v "$PWD/ops/haproxy:/usr/local/etc/haproxy:ro" \
            haproxy:3.0-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      - name: Alloy config
        run: |
          docker run --rm -v "$PWD/ops/alloy:/cfg:ro" \
            grafana/alloy:v1.10.0 fmt /cfg/config.alloy
      - name: Grafana dashboard JSON
        run: python -c "import json,sys; json.load(open('ops/grafana/dashboards/quantedge.json'))"

  # Kills API replicas and the scheduler leader under load; fails if a single
  # request is dropped or the standby does not take over within 30s.
  failover:
    runs-on: ubuntu-latest
    needs: [backend, ops-config]
    steps:
      - uses: actions/checkout@v5
      - name: Failover drill
        run: bash ops/failover_test.sh
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile ha logs --tail 200
