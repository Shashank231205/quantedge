# Scrapes every API and scheduler replica individually (via Docker DNS), plus
# the load balancer. Aggregation across replicas happens in queries, so losing
# one replica shows up as a missing series rather than a skewed average.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: scheduler
    dns_sd_configs:
      - names: ["scheduler"]
        type: A
        port: 9101
        refresh_interval: 10s

  - job_name: haproxy
    static_configs:
      - targets: ["lb:8404"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
