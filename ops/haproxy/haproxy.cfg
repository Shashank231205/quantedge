# Load balancer for the API replicas (docker compose --profile ha).
#
# Replicas are discovered through Docker's DNS, so scaling the `api` service
# needs no change here. A replica leaves rotation after two failed readiness
# checks (~4s); a request that was sent to it and got no answer is retried on
# another replica rather than surfaced to the client.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    # Retry only where the replica died before answering: the connection was
    # refused, or it closed without a response. Both mean the request did not
    # complete, and every mutating endpoint here is safe to replay. Timeouts
    # are deliberately not retried; a slow request is not a failed one.
    retries 3
    retry-on conn-failure empty-response
    option redispatch 1

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold nx 5s

frontend api
    bind :8080
    # Tag every request so one call can be traced through the balancer log
    # and the replica's JSON log. A caller-supplied ID is kept.
    unique-id-format %[uuid()]
    http-request set-header X-Request-ID %[unique-id] unless { req.hdr(X-Request-ID) -m found }
    default_backend api

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s

backend api
    balance roundrobin
    # Readiness, not liveness: an instance that is up but cannot reach the
    # database should stop receiving traffic, not keep answering 500s.
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr none
    server-template api 4 api:8000 check
