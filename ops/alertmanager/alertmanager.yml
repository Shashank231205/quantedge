# Alerts are delivered to the API itself, which writes each one to its log.
# That puts them on the System Health screen and in Loki with no third-party
# account needed; swapping in Slack or email is a new receiver, nothing else.

route:
  receiver: quantedge
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: quantedge
    webhook_configs:
      - url: http://lb:8080/v1/system/alerts
        send_resolved: true
        http_config:
          # Must equal the API's API_KEY. Alertmanager does not expand
          # environment variables, so outside local development mount the key
          # as a file and use `credentials_file` instead.
          authorization:
            type: Bearer
            credentials: quantedge-dev-key
