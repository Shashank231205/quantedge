# Render blueprint: the FastAPI service.
#
# The frontend is NOT here: it deploys to Vercel as a static SPA (see
# vercel.json). The database is not here either. Render's free Postgres is
# deleted 30 days after creation, which is how this deployment lost its data
# once already, so the service points at an external free Postgres that does
# not expire (Neon: 0.5GB, enough for the ~120MB this schema holds).
#
# Deploy with: render blueprint launch   (or connect the repo in the dashboard)
# Seed or refresh the data with the GitHub Actions workflows in
# .github/workflows/data-*.yml; see README "Deployment".

services:
  - type: web
    name: quantedge-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health/live
    # Migrations run on every deploy; they are idempotent. Seeding market data
    # is a separate, explicit step (the data-seed workflow) because a full
    # ingest takes ~15 minutes and must not run on every restart.
    dockerCommand: >
      sh -c "alembic upgrade head &&
             uvicorn quantedge.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # The Neon connection string, pooled host (…-pooler.…) is fine here;
      # the app disables server-side prepared statements for pooled URLs.
      - key: DATABASE_URL
        sync: false
      # Set to protect /metrics on the public URL; Prometheus sends it as a
      # bearer token.
      - key: METRICS_TOKEN
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Vercel preview deployments get a fresh hostname per commit, so they
      # cannot be listed in CORS_ORIGINS ahead of time.
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: PYTHON_VERSION
        value: "3.11"

      # The free instance has 512MB. Pre-warming the factor and risk caches
      # loads the full 837k-row price panel twice over, which OOMs the process
      # and puts it in a restart loop that reads as a crashing app rather than
      # a memory ceiling. Off here; the first request to each screen pays a few
      # seconds instead. Turn back on when the instance has room.
      - key: WARM_CACHE_ON_STARTUP
        value: "false"

      # Model providers for the Analyst and INU AI screens. All free tiers.
      #
      # `sync: false` means Render prompts for the value rather than reading it
      # from this file, so no key is ever committed. Every one is optional: the
      # Analyst falls back to rule-based templates and INU says plainly that it
      # cannot reach a model, so an instance without keys degrades rather than
      # errors. Set at least GROQ_API_KEY for the chat to answer at all.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Gemini is Analyst-only. INU routes across Groq and OpenRouter, which
      # are the two with free open-weight models.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
